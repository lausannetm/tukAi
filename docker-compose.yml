services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed_catalog_marketplace_services.sql:/docker-entrypoint-initdb.d/02-catalog-services.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      NODE_ENV: production
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      # Set in .env (see .env.example). Required for POST /services/suggest (AI hero search).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Set to 1 for a zero-OpenAI-cost demo (local heuristic instead of ChatGPT).
      OPENAI_MOCK_SUGGEST: ${OPENAI_MOCK_SUGGEST:-}
      SERVICE_UPLOADS_DIR: /app/uploads/services
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - service_uploads:/app/uploads/services
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  # Local SMTP sink + web UI: http://localhost:8025 (configure your app to send via mailhog:1025).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_PUBLIC_URL: ${NEXT_PUBLIC_BACKEND_PUBLIC_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side proxy `app/backend/[...path]/route.ts` forwards /backend/* to the API.
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  service_uploads:
